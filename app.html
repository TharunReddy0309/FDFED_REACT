<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        input {
            padding: 10px;
            width: 100px;
            font-size: 16px;
            margin-right: 5px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .box {
            padding: 15px;
            border-radius: 8px;
            width: 120px;
        }

        .present {
            background-color: #d4edda;
        }

        .absent {
            background-color: #f8d7da;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Attendance Tracker</h1>

        <div class="input-section">
            <label>Total Students:</label>
            <input type="number" id="totalStudents" min="1">
            <button onclick="initializeAttendance()">Set</button>
        </div>

        <div class="stats">

            <div class="box present">
                <div>Present</div>
                <div class="number" id="present">0</div>
            </div>

            <div class="box absent">
                <div>Absent</div>
                <div class="number" id="absent">0</div>
            </div>

        </div>

        <button id="presentButton" onclick="markPresent()" disabled>
            Mark Present
        </button>

    </div>


    <script>

        let totalStudents = 0;
        let presentStudents = 0;
        let absentStudents = 0;


        function initializeAttendance() {

            totalStudents = Number(
                document.getElementById("totalStudents").value
            );

            presentStudents = 0;
            absentStudents = totalStudents;

            updateUI();
        }


        function markPresent() {

            if (absentStudents > 0) {

                presentStudents++;
                absentStudents--;

                updateUI();
            }
        }


        function updateUI() {

            document.getElementById("present").textContent =
                presentStudents;

            document.getElementById("absent").textContent =
                absentStudents;

            document.getElementById("presentButton").disabled =
                absentStudents === 0;
        }

    </script>

</body>
</html>
